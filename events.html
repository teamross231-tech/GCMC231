<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Events | Great Commission Ministries</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="events">

    <div class="app">

        <aside class="sidebar"></aside>

        <main class="main">

            <header class="topbar">
                <button class="menu-button" aria-label="Open menu">
                    ☰
                </button>

                <strong>Church Events</strong>

                <div class="admin">
                    Administrator

                    <div class="avatar">
                        AD
                    </div>
                </div>
            </header>

            <section class="content">
                
    <div class="page-header">
        <div>
            <h2>GCMC Events</h2>
            <p>Schedule worship services, meetings and special programs.</p>
        </div>
    </div>

    <div class="card">
        <form id="eventsForm" class="form-grid">

            <div class="field">
                <label>Event Title</label>
                <input name="title" required>
            </div>

            <div class="field">
                <label>Date</label>
                <input name="date" type="date" required>
            </div>

            <div class="field">
                <label>Time</label>
                <input name="time" type="time" required>
            </div>

            <div class="field">
                <label>Location</label>
                <input name="location">
            </div>

            <div class="field">
                <label>Status</label>
                <select name="status">
                    <option>Scheduled</option>
                    <option>Completed</option>
                    <option>Cancelled</option>
                </select>
            </div>

            <div class="field">
                <button class="btn btn-primary">
                    Add Event
                </button>
            </div>

        </form>
    </div>

    <div class="card" style="margin-top: 18px;">
        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="eventsTable"></tbody>
            </table>
        </div>
    </div>
    
            </section>

        </main>

    </div>

    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
