<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donations | Great Commission Ministries</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="donations">

    <div class="app">

        <aside class="sidebar"></aside>

        <main class="main">

            <header class="topbar">
                <button class="menu-button" aria-label="Open menu">
                    ☰
                </button>

                <strong>Donations</strong>

                <div class="admin">
                    Administrator

                    <div class="avatar">
                        AD
                    </div>
                </div>
            </header>

            <section class="content">
                
    <div class="page-header">
        <div>
            <h2>Donations & Giving</h2>
            <p>Track church donations and designated giving.</p>
        </div>
    </div>

    <div class="card">
        <form id="donationsForm" class="form-grid">

            <div class="field">
                <label>Donor</label>
                <input name="donor" required>
            </div>

            <div class="field">
                <label>Purpose</label>
                <input name="purpose" required>
            </div>

            <div class="field">
                <label>Amount (LRD)</label>
                <input name="amount" type="number" min="0" required>
            </div>

            <div class="field">
                <label>Date</label>
                <input name="date" type="date" required>
            </div>

            <div class="field">
                <button class="btn btn-primary">
                    Record Donation
                </button>
            </div>

        </form>
    </div>

    <div class="card" style="margin-top: 18px;">
        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Donor</th>
                        <th>Purpose</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="donationsTable"></tbody>
            </table>
        </div>
    </div>
    
            </section>

        </main>

    </div>

    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
