<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | Great Commission Ministries</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="members">

    <div class="app">

        <aside class="sidebar"></aside>

        <main class="main">

            <header class="topbar">
                <button class="menu-button" aria-label="Open menu">
                    ☰
                </button>

                <strong>Members</strong>

                <div class="admin">
                    Administrator

                    <div class="avatar">
                        AD
                    </div>
                </div>
            </header>

            <section class="content">
                
    <div class="page-header">
        <div>
            <h2>Member Management</h2>
            <p>Register and manage church member information.</p>
        </div>

        <button
            class="btn btn-primary"
            onclick="openModal('memberModal')"
        >
            + Add Member
        </button>
    </div>

    <div class="card">

        <div class="toolbar">
            <input
                type="search"
                id="memberSearch"
                class="search"
                placeholder="Search members..."
            >
        </div>

        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="membersTable"></tbody>
            </table>
        </div>

    </div>

    <div id="memberModal" class="modal">

        <div class="modal-box">

            <div class="modal-header">
                <h3>Add Church Member</h3>

                <button
                    class="close"
                    onclick="closeModal('memberModal')"
                >
                    ×
                </button>
            </div>

            <form id="memberForm" class="form-grid">

                <div class="field">
                    <label>Full Name</label>
                    <input type="text" name="name" required>
                </div>

                <div class="field">
                    <label>Gender</label>
                    <select name="gender">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div class="field">
                    <label>Phone</label>
                    <input type="tel" name="phone">
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email">
                </div>

                <div class="field">
                    <label>Department</label>
                    <input type="text" name="ministry">
                </div>

                <div class="field">
                    <label>Status</label>
                    <select name="status">
                        <option>Active</option>
                        <option>Inactive</option>
                    </select>
                </div>

                <div class="field">
                    <label>Date Joined</label>
                    <input type="date" name="joined">
                </div>

                <div class="field">
                    <button class="btn btn-primary" type="submit">
                        Save Member
                    </button>
                </div>

            </form>

        </div>

    </div>
    
            </section>

        </main>

    </div>

    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
