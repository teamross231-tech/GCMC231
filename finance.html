<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Expenditure | Great Commission Ministries</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="finance">

    <div class="app">

        <aside class="sidebar"></aside>

        <main class="main">

            <header class="topbar">
                <button class="menu-button" aria-label="Open menu">
                    ☰
                </button>

                <strong>Finance & Expenditure</strong>

                <div class="admin">
                    Administrator

                    <div class="avatar">
                        AD
                    </div>
                </div>
            </header>

            <section class="content">
                
    <div class="page-header">
        <div>
            <h2>Finance & Expenditure</h2>
            <p>Track church income, expenses and balances.</p>
        </div>
    </div>

    <div class="cards">
        <div class="card stat-card">
            <div class="stat-label">Income</div>
            <div class="stat-value" id="financeIncome">LRD 0</div>
        </div>

        <div class="card stat-card">
            <div class="stat-label">Expenses</div>
            <div class="stat-value" id="financeExpense">LRD 0</div>
        </div>

        <div class="card stat-card">
            <div class="stat-label">Balance</div>
            <div class="stat-value" id="financeBalance">LRD 0</div>
        </div>
    </div>

    <div class="card" style="margin-top: 18px;">
        <h3 class="section-title">Record Financial Transaction</h3>

        <form id="financeForm" class="form-grid">

            <div class="field">
                <label>Transaction Type</label>
                <select name="type">
                    <option>Income</option>
                    <option>Expense</option>
                </select>
            </div>

            <div class="field">
                <label>Category</label>
                <input name="category" required>
            </div>

            <div class="field">
                <label>Description</label>
                <input name="description" required>
            </div>

            <div class="field">
                <label>Amount (LRD)</label>
                <input name="amount" type="number" min="0" required>
            </div>

            <div class="field">
                <label>Date</label>
                <input name="date" type="date" required>
            </div>

            <div class="field">
                <label>Payment Method</label>
                <select name="method">
                    <option>Cash</option>
                    <option>Bank</option>
                    <option>Mobile Money</option>
                    <option>Cheque</option>
                </select>
            </div>

            <div class="field">
                <button class="btn btn-primary">
                    Record Transaction
                </button>
            </div>

        </form>
    </div>

    <div class="card" style="margin-top: 18px;">
        <h3 class="section-title">Transaction History</h3>

        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Method</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="financeTable"></tbody>
            </table>
        </div>
    </div>
    
            </section>

        </main>

    </div>

    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
